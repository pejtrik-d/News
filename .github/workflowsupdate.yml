name: update-news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Vypsat do logu, co filtr zahodil"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - name: Stáhnout a ohodnotit zprávy
        run: python fetch_news.py
        env:
          DEBUG: ${{ inputs.debug && '1' || '' }}
      - name: Poslat notifikace
        run: python notify.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Uložit historii do repozitáře
        run: |
          git config user.name "ctecka-bot"
          git config user.email "ctecka-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aktualizace dat" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
